<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登录写作后台 · 项目手记</title><link rel="stylesheet" href="./login.css"><script defer src="./login.js"></script></head>
<body><main><a class="brand" href="/projects/">项目手记</a><h1>开始写作</h1><p class="intro">使用已授权的账号登录，管理你的文章与图片。</p>
<a id="google" class="button secondary" href="./google/start" hidden>使用 Google 账号登录</a><p id="google-pending" class="hint" hidden>Google 登录正在配置，可先使用邮箱验证码或 GitHub。</p>
<div class="separator">邮箱验证码</div><form id="email-form"><label for="email">QQ 邮箱</label><div class="row"><input id="email" type="email" autocomplete="email" placeholder="输入已授权的 QQ 邮箱" required><button id="send" type="submit">获取验证码</button></div></form>
<form id="code-form" hidden><label for="code">6 位验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="button primary" type="submit">登录写作后台</button><p class="hint">验证码 10 分钟内有效。请在当前浏览器完成登录。</p></form>
<p id="status" role="status" aria-live="polite"></p><a class="github" href="/projects/admin/?login=github">继续使用 GitHub 登录</a><p class="footnote">仅向已授权邮箱开放。登录不授予其他人管理权限。</p></main></body></html>
